name: Reproduce model benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-torch-cpu.txt
      - run: .venv/bin/python -m pip install -c requirements.lock -e .
      - run: .venv/bin/python -m forgesight.cli setup
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e --prefix web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-and-browser-results
          path: |
            reports/*.json
            web/playwright-report
          retention-days: 14
